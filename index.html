                p2Right = new Player(NET_X + 150, 'right', p2RightControls, true, 'setter', rSetterId);
                players = [p1Left, p2Left, p1Right, p2Right];
            }
            
            applyModeSettings();
            hideMessage();
            resetPositions();
            gameState = 'SERVING';
            tossCharge = 0;
        });

        populateCharSelects();
        updateScores();
        msgBox.style.display = 'block';

        function gameLoop() {
            if (isPaused) return; 

            if (gameState === 'SERVING') {
                camTargetX = servingTeam === 'left' ? -100 : 100; 
            } else if (gameState === 'PLAYING' || gameState === 'POINT_OVER' || gameState === 'SERVING_TOSSED' || gameState === 'MATCH_OVER') {
                let ballOffset = ball.x - canvas.width / 2;
                if (Math.abs(ballOffset) < 400) {
                    camTargetX = ballOffset * 0.4; 
                } else {
                    let excess = Math.abs(ballOffset) - 400;
                    camTargetX = (400 * 0.4 + excess) * Math.sign(ballOffset); 
                }
                
                if (gameState === 'MATCH_OVER') {
                    camTargetX = matchWinner === 'left' ? -200 : 200; 
                }
                camTargetX = Math.max(-2000, Math.min(2000, camTargetX)); 
            } else {
                camTargetX = 0;
            }
            camX += (camTargetX - camX) * 0.08; 

            ctx.save();
            
            let dx = -camX;
            let dy = 0;
            if (screenShake > 0) {
                dx += (Math.random() - 0.5) * screenShake;
                dy += (Math.random() - 0.5) * screenShake;
                screenShake *= 0.9;
                if (screenShake < 0.5) screenShake = 0;
            }
            ctx.translate(dx, dy);

            ctx.clearRect(camX, 0, canvas.width, canvas.height); 
            
            drawBackground();

            if (gameState === 'SERVING') {
                if (serverPlayer.isAI) {
                    if (tossCharge === 0) tossCharge = 0.01;
                    tossCharge += 0.015; 
                    if (tossCharge >= 0.4) { 
                        executeToss(serverPlayer);
                    }
                } else {
                    let hitKey = serverPlayer.controls.down;
                    if (keys[hitKey]) {
                        if (tossCharge === 0) tossCharge = 0.01;
                        tossCharge += 0.015 * tossDirection;
                        if (tossCharge >= 1 || tossCharge <= 0) tossDirection *= -1;
                    } else if (tossCharge > 0) {
                        executeToss(serverPlayer);
                    }
                }
            }

            if (hitStopFrames > 0) {
                hitStopFrames--;
            } else if (gameState === 'PLAYING' || gameState === 'SERVING_TOSSED' || gameState === 'SERVING' || gameState === 'POINT_OVER') {
                players.forEach(p => {
                    p.update();
                    if (gameState !== 'POINT_OVER') p.checkCollision(ball);
                });
                
                if (gameState !== 'SERVING') {
                    ball.update();
                }
            }

            players.forEach(p => p.draw(ctx));
            
            if (gameState === 'SERVING_TOSSED' || gameState === 'PLAYING' || gameState === 'POINT_OVER' || gameState === 'MATCH_OVER') {
                 ball.draw(ctx);
            }
            
            if (gameState === 'SERVING_TOSSED' || gameState === 'PLAYING' || gameState === 'POINT_OVER') {
                let screenLeft = camX;
                let screenRight = camX + canvas.width;
                
                if (ball.y < 0 || ball.x < screenLeft || ball.x > screenRight) {
                    let ix = ball.x;
                    let iy = ball.y;
                    let pointing = '';
                    
                    if (ball.y < 0) { iy = 40; pointing = 'up'; }
                    if (ball.x < screenLeft) { ix = screenLeft + 40; pointing = 'left'; }
                    if (ball.x > screenRight) { ix = screenRight - 40; pointing = 'right'; }
                    
                    if (ball.x < screenLeft && ball.y < 0) { ix = screenLeft + 40; iy = 40; pointing = 'up-left'; }
                    if (ball.x > screenRight && ball.y < 0) { ix = screenRight - 40; iy = 40; pointing = 'up-right'; }
                    
                    ctx.save();
                    ctx.translate(ix, iy);
                    ctx.fillStyle = '#ffeb3b';
                    ctx.strokeStyle = '#1a202c';
                    ctx.lineWidth = 2;
                    
                    ctx.beginPath();
                    if (pointing.includes('up')) {
                        ctx.moveTo(0, -15); ctx.lineTo(-12, 10); ctx.lineTo(12, 10);
                    } else if (pointing === 'left') {
                        ctx.moveTo(-15, 0); ctx.lineTo(10, -12); ctx.lineTo(10, 12);
                    } else if (pointing === 'right') {
                        ctx.moveTo(15, 0); ctx.lineTo(-10, -12); ctx.lineTo(-10, 12);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    
                    ctx.beginPath();
                    if (pointing.includes('up')) {
                        ctx.arc(0, 20, 6, 0, Math.PI*2);
                    } else if (pointing === 'left') {
                        ctx.arc(20, 0, 6, 0, Math.PI*2);
                    } else if (pointing === 'right') {
                        ctx.arc(-20, 0, 6, 0, Math.PI*2);
                    }
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
            }

            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => { p.update(); p.draw(ctx); });

            // Fix for the cut-off code: Complete the trajectory loop and end block
            if (gameState === 'SERVING' && tossCharge > 0 && serverPlayer) {
                ball.draw(ctx); 
                
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.setLineDash([8, 8]);
                ctx.lineWidth = 4;
                
                let simX = ball.x;
                let simY = ball.y;
                let angle = Math.PI/2 - (tossCharge * Math.PI/18); 
                let power = 13 + (tossCharge * 5);
                let simVx = Math.cos(angle) * power * (serverPlayer.team === 'left' ? 1 : -1);
                let simVy = -Math.sin(angle) * power;
                
                ctx.moveTo(simX, simY);
                for(let i = 0; i < 40; i++) {
                    simX += simVx;
                    simY += simVy;
                    simVy += GRAVITY;
                    ctx.lineTo(simX, simY);
                    if (simY > GROUND_Y) break;
                }
                ctx.stroke();
            }

            ctx.restore();
            
            // Match progression logic
            if (gameState === 'POINT_OVER') {
                pointEndTimer++;
                
                if (pointReason && pointEndTimer < 60) {
                    ctx.save();
                    ctx.fillStyle = '#e53e3e';
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 4;
                    ctx.font = 'bold 64px Inter';
                    ctx.textAlign = 'center';
                    let yPos = GROUND_Y - 300 - (pointEndTimer * 1.5);
                    let xPos = ball.impactX || NET_X;
                    
                    let viewLeft = camX + 200;
                    let viewRight = camX + canvas.width - 200;
                    xPos = Math.max(viewLeft, Math.min(viewRight, xPos));
                    
                    ctx.strokeText(pointReason, xPos, yPos);
                    ctx.fillText(pointReason, xPos, yPos);
                    ctx.restore();
                }
                
                if (pointEndTimer > 150) {
                    if (pointWinner === 'left') scoreLeft++;
                    else scoreRight++;
                    
                    updateScores();
                    
                    if (scoreLeft >= WIN_SCORE && scoreLeft - scoreRight >= 2) {
                        gameState = 'MATCH_OVER';
                        matchWinner = 'left';
                        matchEndTimer = 0;
                    } else if (scoreRight >= WIN_SCORE && scoreRight - scoreLeft >= 2) {
                        gameState = 'MATCH_OVER';
                        matchWinner = 'right';
                        matchEndTimer = 0;
                    } else {
                        servingTeam = pointWinner;
                        resetPositions();
                        gameState = 'SERVING';
                    }
                }
            } else if (gameState === 'MATCH_OVER') {
                matchEndTimer++;
                
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(camX, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 6;
                ctx.font = 'bold 80px Inter';
                ctx.textAlign = 'center';
                let winnerText = matchWinner === 'left' ? 'LEFT TEAM WINS!' : 'RIGHT TEAM WINS!';
                ctx.strokeText(winnerText, camX + canvas.width/2, canvas.height/2);
                ctx.fillText(winnerText, camX + canvas.width/2, canvas.height/2);
                ctx.restore();

                if (matchEndTimer === 1 && gameMode === '1P' && matchWinner === 'left') {
                    let newHitters = [p1Right.charId];
                    let newSetters = [p2Right.charId];
                    let unlockedAny = false;
                    
                    newHitters.forEach(id => { if(saveUnlock(id)) { recentlyUnlocked.push(CHARACTERS.hitters[id].name); unlockedAny = true; } });
                    newSetters.forEach(id => { if(saveUnlock(id)) { recentlyUnlocked.push(CHARACTERS.setters[id].name); unlockedAny = true; } });
                    
                    if (unlockedAny) populateCharSelects();
                }

                if (recentlyUnlocked.length > 0) {
                    ctx.save();
                    ctx.fillStyle = '#f6e05e';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 4;
                    ctx.font = 'bold 32px Inter';
                    ctx.textAlign = 'center';
                    let txt = "UNLOCKED: " + recentlyUnlocked.join(', ');
                    ctx.strokeText(txt, camX + canvas.width/2, canvas.height/2 + 80);
                    ctx.fillText(txt, camX + canvas.width/2, canvas.height/2 + 80);
                    ctx.restore();
                }
                
                if (matchEndTimer > 240) {
                    gameState = 'START';
                    showMessage('Indoor Volleyball', `${matchWinner === 'left' ? 'Left' : 'Right'} Team Won!`, 'Play Again');
                }
            }
            
            requestAnimationFrame(gameLoop);
        }

        // Boot up game engine
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
